name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Verilator (OSS CAD Suite)
        uses: YosysHQ/setup-oss-cad-suite@v3

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      # The gds flow builds from src/project.v, which sv2v generates from the .sv
      # sources. Fail if it was not regenerated after an RTL change.
      - name: Check src/project.v is up to date
        shell: bash
        run: |
          curl -sSL -o /tmp/sv2v.zip https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip
          unzip -q /tmp/sv2v.zip -d /tmp
          export PATH="/tmp/sv2v-Linux:$PATH"
          make sv2v-check

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failed tests in results.xml.
          ! grep -E '<(failure|error)' results.xml
          # same tests on the generated Verilog the chip is built from
          make clean
          make SV2V=1
          ! grep -E '<(failure|error)' results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
